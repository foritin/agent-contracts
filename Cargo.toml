[workspace]
resolver = "2"
members = [
    "crates/agent-error",
    "crates/agent-contract",
    "crates/agent-llm",
    "crates/agent-mcp",
    "crates/agent-store",
    "crates/agent-config",
    "crates/agent-compaction",
    "crates/agent-ipc",
    "crates/agent-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/foritin/agent-contracts"
authors = ["R-Code & Tiny Hermes shared team"]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# 错误与日志
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 通用工具
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
dirs = "5"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# 内部 crate（workspace 别名）
agent-error = { path = "crates/agent-error" }
agent-contract = { path = "crates/agent-contract" }
agent-llm = { path = "crates/agent-llm" }
agent-mcp = { path = "crates/agent-mcp" }
agent-store = { path = "crates/agent-store" }
agent-config = { path = "crates/agent-config" }
agent-compaction = { path = "crates/agent-compaction" }
agent-ipc = { path = "crates/agent-ipc" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
